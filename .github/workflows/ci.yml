name: Package checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: npm test
      - run: npm --prefix scripts/consumers ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/integration.cjs

  bun-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test:bun
      - run: bun run typecheck
      - run: npm --prefix scripts/type-consumers ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/sync-types.cjs --check
      - run: npm run test:types
      - run: node scripts/check-type-archives.cjs
      - run: npm --prefix scripts/consumers ci --ignore-scripts --no-audit --no-fund
      - run: bun scripts/integration.cjs
