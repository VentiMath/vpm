name: Package checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: npm --prefix scripts/consumers ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/google-http-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/retry-request-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/teeny-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/duplexify-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/paginator-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: node scripts/integration.cjs
      - run: |
          node scripts/paginator-conformance/regressions.cjs
          node scripts/paginator-conformance/run.cjs
          node scripts/paginator-conformance/run.cjs --upstream
          node scripts/paginator-conformance/callers.cjs --upstream
          node scripts/duplexify-conformance/regressions.cjs
          node scripts/duplexify-conformance/run.cjs
          node scripts/duplexify-conformance/run.cjs --upstream
          node scripts/duplexify-conformance/callers.cjs --upstream
          node scripts/teeny-conformance/run.cjs
          node scripts/teeny-conformance/run.cjs --upstream
          node scripts/teeny-conformance/callers.cjs --upstream
      - run: node scripts/google-http-conformance/helpers.cjs
      - run: node scripts/google-http-conformance/uuid.cjs
      - run: node scripts/google-http-conformance/fetch.cjs
      - run: |
          node scripts/google-http-conformance/current-fetch.cjs
          node scripts/google-http-conformance/current-fetch.cjs --upstream
          node scripts/google-http-conformance/current-fetch.cjs --native
      - run: node scripts/google-http-conformance/gaxios.cjs
      - run: node scripts/google-http-conformance/gtoken.cjs
      - run: node scripts/google-http-conformance/logging.cjs
      - run: node scripts/google-http-conformance/json.cjs
      - run: node scripts/google-http-conformance/metadata.cjs
      - run: node scripts/google-auth-conformance/run.cjs
      - run: |
          node scripts/retry-request-conformance/run.cjs
          node scripts/retry-request-conformance/timers.cjs
          node scripts/retry-request-conformance/callers.cjs --check-control
          node scripts/stream-events-conformance/run.cjs
          node scripts/stream-events-conformance/callers.cjs --upstream
      - run: npm --prefix scripts/jwt-conformance ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/jwt-conformance/run.cjs
      - run: npm --prefix scripts/jwks-conformance ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/jwks-conformance/run.cjs
      - run: npm --prefix scripts/agent-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/http-proxy-conformance ci --ignore-scripts --no-audit --no-fund
      - run: |
          node scripts/http-proxy-conformance/run.cjs
          node scripts/http-proxy-conformance/run.cjs --upstream
          node scripts/http-proxy-conformance/callers.cjs --upstream
      - run: node scripts/agent-conformance/run.cjs
      - run: |
          node scripts/agent-conformance/current/run.cjs
          node scripts/agent-conformance/current/run.cjs --upstream
          node scripts/agent-conformance/current/proxy.cjs
      - run: npm --prefix scripts/https-proxy-conformance ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/https-proxy-conformance/run.cjs
      - run: npm --prefix scripts/express-conformance ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/express-conformance/run.cjs
      - run: npm --prefix scripts/framework-conformance ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/framework-conformance/run.cjs
      - run: npm --prefix scripts/router-conformance ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/router-conformance/run.cjs

  bun-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: npm --prefix scripts/consumers ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/google-http-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/retry-request-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/teeny-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/duplexify-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/paginator-conformance ci --ignore-scripts --no-audit --no-fund
      - run: bun run test:bun
      - run: bun run typecheck
      - run: bun run check:docs
      - run: npm --prefix scripts/type-consumers ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/sync-types.cjs --check
      - run: npm run test:types
      - run: npm --prefix scripts/legacy-typescript ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/check-legacy-types.cjs
      - run: node scripts/check-type-archives.cjs
      - run: node scripts/check-media-archives.cjs
      - run: bun scripts/integration.cjs
      - run: |
          bun scripts/paginator-conformance/regressions.cjs
          bun scripts/paginator-conformance/run.cjs
          bun scripts/paginator-conformance/run.cjs --upstream
          bun scripts/paginator-conformance/callers.cjs --upstream
          bun scripts/duplexify-conformance/regressions.cjs
          bun scripts/duplexify-conformance/run.cjs
          bun scripts/duplexify-conformance/run.cjs --upstream
          bun scripts/duplexify-conformance/callers.cjs --upstream
          bun scripts/teeny-conformance/run.cjs
          bun scripts/teeny-conformance/run.cjs --upstream
          bun scripts/teeny-conformance/callers.cjs --upstream
      - run: bun scripts/google-http-conformance/helpers.cjs
      - run: bun scripts/google-http-conformance/uuid.cjs
      - run: bun scripts/google-http-conformance/fetch.cjs
      - run: |
          bun test ./scripts/google-http-conformance/current-fetch.cjs
          FETCH_MODE=upstream bun test ./scripts/google-http-conformance/current-fetch.cjs
          FETCH_MODE=native bun test ./scripts/google-http-conformance/current-fetch.cjs
      - run: bun scripts/google-http-conformance/gaxios.cjs
      - run: bun scripts/google-http-conformance/gtoken.cjs
      - run: bun scripts/google-http-conformance/logging.cjs
      - run: bun scripts/google-http-conformance/json.cjs
      - run: bun scripts/google-http-conformance/metadata.cjs
      - run: bun scripts/google-auth-conformance/run.cjs
      - run: |
          bun scripts/retry-request-conformance/run.cjs
          bun scripts/retry-request-conformance/timers.cjs
          bun scripts/retry-request-conformance/callers.cjs --check-control
          bun scripts/stream-events-conformance/run.cjs
          bun scripts/stream-events-conformance/callers.cjs --upstream
      - run: npm --prefix scripts/jwt-conformance ci --ignore-scripts --no-audit --no-fund
      - run: bun scripts/jwt-conformance/run.cjs
      - run: npm --prefix scripts/jwks-conformance ci --ignore-scripts --no-audit --no-fund
      - run: bun scripts/jwks-conformance/run.cjs
      - run: npm --prefix scripts/agent-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/http-proxy-conformance ci --ignore-scripts --no-audit --no-fund
      - run: |
          bun scripts/http-proxy-conformance/run.cjs
          bun scripts/http-proxy-conformance/run.cjs --upstream
          bun scripts/http-proxy-conformance/callers.cjs --upstream
      - run: bun scripts/agent-conformance/run.cjs
      - run: |
          bun scripts/agent-conformance/current/run.cjs
          bun scripts/agent-conformance/current/run.cjs --upstream
          bun scripts/agent-conformance/current/proxy.cjs
      - run: npm --prefix scripts/https-proxy-conformance ci --ignore-scripts --no-audit --no-fund
      - run: bun scripts/https-proxy-conformance/run.cjs
      - run: npm --prefix scripts/express-conformance ci --ignore-scripts --no-audit --no-fund
      - run: bun scripts/express-conformance/run.cjs
      - run: npm --prefix scripts/framework-conformance ci --ignore-scripts --no-audit --no-fund
      - run: bun scripts/framework-conformance/run.cjs
      - run: npm --prefix scripts/router-conformance ci --ignore-scripts --no-audit --no-fund
      - run: bun scripts/router-conformance/run.cjs
