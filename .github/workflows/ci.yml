name: Package checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install verified current ICU timezone resources
        run: node scripts/time-zone-conformance/install-data.cjs
      - run: node scripts/check-bun.cjs
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: npm --prefix scripts/consumers ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/motion-utils-conformance ci --ignore-scripts --no-audit --no-fund
      - name: Motion utilities and unchanged animation callers
        run: |
          node scripts/motion-utils-conformance/check-controls.cjs
          node scripts/motion-utils-conformance/run.mjs
          node scripts/motion-utils-conformance/diagnostics.cjs
          bun scripts/motion-utils-conformance/build-browser.cjs
          node scripts/motion-utils-conformance/callers.cjs
          node scripts/motion-utils-conformance/browser.cjs
          node scripts/motion-utils-conformance/types.cjs
          node scripts/motion-utils-conformance/archives.cjs
      - name: Motion values, frames, mapping and local archives
        run: |
          node scripts/motion-dom-conformance/run.cjs
          node scripts/motion-dom-conformance/values.cjs
          node scripts/motion-dom-conformance/playback.cjs
          node scripts/motion-dom-conformance/spring.cjs
          node scripts/motion-dom-conformance/elements.cjs
          node scripts/motion-dom-conformance/handoff.cjs
          node scripts/motion-dom-conformance/renderer.cjs
          node scripts/motion-dom-conformance/groups.cjs
          node scripts/motion-dom-conformance/targets.cjs
          node scripts/motion-dom-conformance/mixers.cjs
          node scripts/motion-dom-conformance/neutral.cjs
          node scripts/motion-dom-conformance/selectors.cjs
          node scripts/motion-dom-conformance/custom-effects.cjs
          node scripts/motion-dom-conformance/effect-end.cjs
          node scripts/motion-dom-conformance/subjects.cjs
          node scripts/motion-dom-conformance/single.cjs
          node scripts/motion-dom-conformance/reads.cjs
          node scripts/motion-dom-conformance/transitions.cjs
          node scripts/motion-dom-conformance/effects.cjs
          node scripts/motion-dom-conformance/types.cjs
          node scripts/motion-dom-conformance/browser.cjs
          node scripts/motion-dom-conformance/archives.cjs
      - run: npm --prefix scripts/hook-form-conformance ci --ignore-scripts --no-audit --no-fund
      - name: Calendar timezone data and civil-day regression guard
        run: |
          node scripts/time-zone-conformance/run.cjs
          node scripts/time-zone-conformance/browser.cjs
      - run: npm --prefix scripts/resolvers-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/scheduler-conformance ci --ignore-scripts --no-audit --no-fund
      - name: Scheduler priorities and React integration
        run: |
          node --test packages/vscheduler/test/scheduler.test.cjs
          node scripts/scheduler-conformance/contract.cjs
          node scripts/scheduler-conformance/types.cjs
          node scripts/scheduler-conformance/browser.cjs
          VPM_REACT_MODE=development node scripts/scheduler-conformance/browser.cjs
          node scripts/scheduler-conformance/archives.cjs
      - run: npm --prefix scripts/mui-system-conformance ci --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: Material controls text icons and application themes
        run: |
          node --test packages/vmui-material/test/*.test.cjs
          node scripts/mui-material-conformance/contract.cjs
          node scripts/mui-material-conformance/text-contract.cjs
          node scripts/mui-material-conformance/types.cjs
          node scripts/mui-material-conformance/browser.cjs
          VPM_REACT_MODE=development node scripts/mui-material-conformance/browser.cjs
          node scripts/mui-material-conformance/text-browser.cjs
          VPM_REACT_MODE=development node scripts/mui-material-conformance/text-browser.cjs
          node scripts/mui-material-conformance/archives.cjs
      - name: MUI System themes, layouts and unchanged Material callers
        run: |
          node --test packages/vmui-system/test/system.test.cjs
          node scripts/mui-system-conformance/primitives.cjs
          node scripts/mui-system-conformance/colors.cjs
          node scripts/mui-system-conformance/variables.cjs
          node scripts/mui-system-conformance/types.cjs
          node scripts/mui-system-conformance/callers.cjs
          node scripts/mui-system-conformance/browser.cjs
          VPM_REACT_MODE=development node scripts/mui-system-conformance/browser.cjs
          node scripts/mui-system-conformance/archives.cjs
      - run: npm --prefix scripts/mui-utils-conformance ci --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: MUI utility contracts and unchanged Material callers
        run: |
          node --test packages/vmui-utils/test/utils.test.cjs
          node scripts/mui-utils-conformance/run.cjs
          node scripts/mui-utils-conformance/callers.cjs
          node scripts/mui-utils-conformance/browser.cjs
          VPM_REACT_MODE=development node scripts/mui-utils-conformance/browser.cjs
          node scripts/mui-utils-conformance/types.cjs
          node scripts/mui-utils-conformance/archives.cjs
      - run: npm --prefix scripts/mui-engine-conformance ci --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: MUI styling bridge and application cache ownership
        run: |
          node --test packages/vmui-styled-engine/test/engine.test.cjs
          node scripts/mui-engine-conformance/run.cjs
          node scripts/mui-engine-conformance/callers.cjs
          node scripts/mui-engine-conformance/browser.cjs
          VPM_REACT_MODE=development node scripts/mui-engine-conformance/browser.cjs
          node scripts/mui-engine-conformance/types.cjs
          node scripts/mui-engine-conformance/archives.cjs
      - run: npm --prefix scripts/mui-theming-conformance ci --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: MUI theme context and unchanged system callers
        run: |
          node --test packages/vmui-private-theming/test/theme.test.cjs
          node scripts/mui-theming-conformance/run.cjs
          node scripts/mui-theming-conformance/callers.cjs
          node scripts/mui-theming-conformance/browser.cjs
          VPM_REACT_MODE=development node scripts/mui-theming-conformance/browser.cjs
          node scripts/mui-theming-conformance/types.cjs
          node scripts/mui-theming-conformance/archives.cjs
      - run: npm --prefix scripts/crypto-js-conformance ci --ignore-scripts --no-audit --no-fund
      - name: Contest hashes, native browser oracle and packed consumers
        run: |
          node --test packages/vcrypto-js/test/hash.test.cjs
          node scripts/crypto-js-conformance/run.cjs
          VPM_CRYPTO_NATIVE=1 node scripts/crypto-js-conformance/run.cjs
          VPM_CRYPTO_NATIVE=1 node --test packages/vcrypto-js/test/hash.test.cjs
          node scripts/crypto-js-conformance/browser.cjs
          node scripts/crypto-js-conformance/types.cjs
          node scripts/crypto-js-conformance/archives.cjs
      - run: npm --prefix scripts/vite-paths-conformance ci --ignore-scripts --no-audit --no-fund
      - name: Vite alias plugin, configuration invalidation and packed consumers
        run: |
          node --test packages/vvite-tsconfig-paths/test/plugin.test.cjs
          node scripts/vite-paths-conformance/run.cjs
          node scripts/vite-paths-conformance/types.cjs
          node scripts/vite-paths-conformance/archives.cjs
      - run: npm --prefix scripts/tsconfck-conformance ci --ignore-scripts --no-audit --no-fund
      - name: Configuration reader, unchanged Vite plugins and packed consumers
        run: |
          node --test packages/vtsconfck/test/config.test.cjs
          node scripts/tsconfck-conformance/run.cjs
          node scripts/tsconfck-conformance/callers.cjs
          node scripts/tsconfck-conformance/types.cjs
          node scripts/tsconfck-conformance/archives.cjs
      - run: npm --prefix scripts/react-popper-conformance ci --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: Navigation popovers, browser lifecycle and pinned consumers
        run: |
          node --test packages/vreact-popper/test/navigation.test.cjs
          node scripts/react-popper-conformance/run.cjs
          node scripts/react-popper-conformance/types.cjs
          node scripts/react-popper-conformance/browser.cjs
          VPM_REACT_MODE=development node scripts/react-popper-conformance/browser.cjs
          node scripts/react-popper-conformance/archives.cjs
      - run: npm --prefix scripts/jwt-decode-conformance ci --ignore-scripts --no-audit --no-fund
      - name: Token decoding, browser and packed consumers
        run: |
          node --test packages/vjwt-decode/test/decode.test.cjs
          node scripts/jwt-decode-conformance/run.cjs
          node scripts/jwt-decode-conformance/types.cjs
          node scripts/jwt-decode-conformance/browser.cjs
          node scripts/jwt-decode-conformance/archives.cjs
      - run: npm --prefix scripts/react-i18next-conformance ci --ignore-scripts --no-audit --no-fund
      - name: React translation hooks, browser lifecycle and packed consumers
        run: |
          node --test packages/vreact-i18next/test/hooks.test.cjs
          node scripts/react-i18next-conformance/run.cjs
          node scripts/react-i18next-conformance/types.cjs
          node scripts/react-i18next-conformance/browser.cjs
          VPM_REACT_MODE=development node scripts/react-i18next-conformance/browser.cjs
          node scripts/react-i18next-conformance/archives.cjs
      - run: npm --prefix scripts/i18next-conformance ci --ignore-scripts --no-audit --no-fund
      - name: Translation engine, unchanged React adapters and packed consumers
        run: |
          node --test packages/vi18next/test/translations.test.cjs
          node scripts/i18next-conformance/run.cjs
          node scripts/i18next-conformance/types.cjs
          node scripts/i18next-conformance/browser.cjs
          node scripts/i18next-conformance/archives.cjs
      - run: npm --prefix scripts/date-fns-conformance ci --ignore-scripts --no-audit --no-fund
      - name: Date utilities, unchanged MUI picker and packed consumers
        run: |
          node --test packages/vdate-fns/test/dates.test.cjs
          node scripts/date-fns-conformance/run.cjs
          node scripts/date-fns-conformance/adapter.cjs
          node scripts/date-fns-conformance/types.cjs
          node scripts/date-fns-conformance/browser.cjs
          node scripts/date-fns-conformance/archives.cjs
      - run: npm --prefix scripts/zod-conformance ci --ignore-scripts --no-audit --no-fund
      - name: Zod schema language, form stack and installed consumers
        run: |
          node --test packages/vzod/test/schema.test.cjs
          node scripts/zod-conformance/run.cjs
          node scripts/zod-conformance/forms.cjs
          node scripts/zod-conformance/types.cjs
          VZOD_ENTRY="$PWD/packages/vzod/index.cjs" VRESOLVERS_ZOD="$PWD/packages/vhookform-resolvers/zod.cjs" node scripts/hook-form-conformance/browser.cjs
          node scripts/zod-conformance/archives.cjs
      - name: Zod adapter behavior, form integration and exact archives
        run: |
          node --test packages/vhookform-resolvers/test/resolver.test.cjs
          node scripts/resolvers-conformance/run.cjs
          node scripts/resolvers-conformance/forms.cjs
          node scripts/resolvers-conformance/types.cjs
          VRESOLVERS_ZOD="$PWD/packages/vhookform-resolvers/zod.cjs" node scripts/hook-form-conformance/browser.cjs
          node scripts/resolvers-conformance/archives.cjs
      - name: Hook Form caller behavior, native inputs and exact archives
        run: |
          node --test packages/vreact-hook-form/test/store.test.cjs
          node scripts/hook-form-conformance/run.cjs
          node scripts/hook-form-conformance/types.cjs
          node scripts/hook-form-conformance/browser.cjs
          node scripts/hook-form-conformance/archives.cjs
      - run: npm --prefix scripts/moment-conformance ci --ignore-scripts --no-audit --no-fund
      - name: Moment countdown dates, durations, DST and exact archives
        run: |
          node --test packages/vmoment/test/countdown.test.cjs
          for tz in UTC America/Los_Angeles Europe/Berlin; do
            TZ="$tz" node scripts/moment-conformance/run.cjs || exit
          done
          node scripts/moment-conformance/types.cjs
          node scripts/moment-conformance/archives.cjs
      - run: npm --prefix scripts/perfect-scrollbar-conformance ci --ignore-scripts --no-audit --no-fund
      - name: Desktop scrollbars, native input and packed consumers
        run: |
          node --test packages/vperfect-scrollbar/test/scrollbar.test.cjs
          node scripts/perfect-scrollbar-conformance/run.cjs
          node scripts/perfect-scrollbar-conformance/types.cjs
          node scripts/perfect-scrollbar-conformance/browser.cjs
          node scripts/perfect-scrollbar-conformance/archives.cjs
      - run: npm --prefix scripts/notistack-conformance ci --ignore-scripts --no-audit --no-fund
      - name: Notification queues, browser callers and local archives
        run: |
          node scripts/notistack-conformance/run.cjs
          node --test packages/vnotistack/test/queue.test.cjs
          node scripts/notistack-conformance/types.cjs
          node scripts/notistack-conformance/browser.cjs
          VNOTISTACK_MODE=development node scripts/notistack-conformance/browser.cjs
          node scripts/notistack-conformance/archives.cjs
      - run: npm --prefix scripts/goober-conformance ci --ignore-scripts --no-audit --no-fund
      - name: Goober object CSS and unchanged notifications
        run: |
          node scripts/goober-conformance/check-controls.cjs
          node scripts/goober-conformance/run.cjs
          node scripts/goober-conformance/types.cjs
          node scripts/goober-conformance/browser.cjs
          node scripts/goober-conformance/archives.cjs
      - run: npm --prefix scripts/diff-conformance ci --ignore-scripts --no-audit --no-fund
      - name: Word diffs, frontend caller and consumer archives
        run: |
          node scripts/diff-conformance/check-controls.cjs
          node scripts/diff-conformance/run.mjs
          node scripts/diff-conformance/generated.mjs
          node scripts/diff-conformance/options.mjs
          node scripts/diff-conformance/types.cjs
          node scripts/diff-conformance/browser.cjs
          node scripts/diff-conformance/archives.cjs
      - run: npm --prefix scripts/ky-conformance ci --ignore-scripts --no-audit --no-fund
      - name: Ky contracts, native HTTP and consumer archives
        run: |
          node scripts/ky-conformance/check-controls.cjs
          node scripts/ky-conformance/run.mjs
          node scripts/ky-conformance/matrix.mjs
          node scripts/ky-conformance/wire.mjs
          node scripts/ky-conformance/browser.cjs
          node scripts/ky-conformance/types.cjs
          node scripts/ky-conformance/archives.cjs
      - run: npm --prefix scripts/react-table-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/table-conformance ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/table-conformance/grouped-selection.cjs
      - run: npm --prefix scripts/store-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/react-virtual-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/google-http-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/retry-request-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/teeny-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/duplexify-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/paginator-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/cloud-utils-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/queue-limit-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/retry-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/numbers-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/xml-helpers-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/path-matcher-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/xml-builder-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/callback-ref-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/sidecar-conformance ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/sidecar-conformance/run.cjs
      - run: node scripts/sidecar-conformance/errors.cjs
      - run: node scripts/sidecar-conformance/archives.cjs
      - run: node scripts/nonce-conformance/run.cjs
      - run: node scripts/nonce-conformance/archives.cjs
      - run: node scripts/style-singleton-conformance/run.cjs
      - run: node scripts/style-singleton-conformance/archives.cjs
      - run: node scripts/scrollbar-conformance/run.cjs
      - run: node scripts/scrollbar-conformance/archives.cjs
      - run: node scripts/scroll-conformance/run.cjs
      - run: node scripts/scroll-conformance/archives.cjs
      - run: npm --prefix scripts/aria-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/radix-primitive-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/compose-refs-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/slot-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/radix-react-primitive-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/radix-context-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/radix-focus-guards-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/radix-effect-event-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/radix-effect-event-conformance/current ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/radix-layout-effect-conformance ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/aria-conformance/run.cjs
      - run: node scripts/aria-conformance/callers.cjs
      - run: node scripts/aria-conformance/archives.cjs
      - run: node scripts/radix-primitive-conformance/archives.cjs
      - run: node scripts/compose-refs-conformance/archives.cjs
      - run: node scripts/slot-conformance/archives.cjs
      - run: node scripts/radix-react-primitive-conformance/archives.cjs
      - run: node scripts/radix-context-conformance/archives.cjs
      - run: node scripts/radix-context-conformance/direction-archives.cjs
      - run: node scripts/radix-focus-guards-conformance/archives.cjs
      - run: node scripts/radix-effect-event-conformance/archives.cjs
      - run: npm --prefix scripts/radix-id-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/radix-id-conformance/current ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/radix-id-conformance/archives.cjs
      - run: npm --prefix scripts/radix-state-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/radix-state-conformance/current ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/radix-state-conformance/archives.cjs
      - run: npm --prefix scripts/radix-rect-conformance ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/radix-rect-conformance/archives.cjs
      - run: npm --prefix scripts/radix-use-size-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/radix-use-size-conformance/current ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/radix-use-size-conformance/archives.cjs
      - run: npm --prefix scripts/radix-arrow-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/radix-arrow-conformance/current ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/radix-arrow-conformance/archives.cjs
      - run: npm --prefix scripts/radix-popper-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/radix-popper-conformance/current ci --ignore-scripts --no-audit --no-fund
      - run: bun scripts/radix-popper-conformance/build.cjs
      - run: node scripts/radix-popper-conformance/archives.cjs
      - run: npm --prefix scripts/radix-collection-conformance ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts/radix-collection-conformance/current ci --ignore-scripts --no-audit --no-fund
      - run: bun scripts/radix-collection-conformance/build.cjs
      - run: node scripts/radix-collection-conformance/archives.cjs
      - run: npm --prefix scripts/orderedmap-conformance ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/orderedmap-conformance/archives.cjs
      - run: npm --prefix scripts/prosemirror-model-conformance ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/prosemirror-model-conformance/run.cjs
      - run: node scripts/prosemirror-model-conformance/archives.cjs
      - run: npm --prefix scripts/prosemirror-transform-conformance ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/prosemirror-transform-conformance/run.cjs
      - run: node scripts/prosemirror-transform-conformance/archives.cjs
      - run: npm --prefix scripts/prosemirror-state-conformance ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/prosemirror-state-conformance/run.cjs
      - run: node scripts/prosemirror-state-conformance/archives.cjs
      - run: npm --prefix scripts/prosemirror-commands-conformance ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/prosemirror-commands-conformance/run.cjs
      - run: node scripts/prosemirror-commands-conformance/archives.cjs
      - run: npm --prefix scripts/autosuggest-widget-conformance ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/autosuggest-widget-conformance/archives.cjs
      - name: Verify Autosuggest release archives
        run: |
          node scripts/pack-autosuggest-release.cjs --ref "$GITHUB_SHA" --tag autosuggest-10.1.0-ci --out "$RUNNER_TEMP/autosuggest-release"
          node scripts/check-autosuggest-release.cjs "$RUNNER_TEMP/autosuggest-release"
      - name: Verify independent table virtualization
        run: |
          npm --prefix scripts/virtual-core-conformance ci --ignore-scripts --no-audit --no-fund
          node scripts/virtual-core-conformance/archives.cjs
      - name: Verify independent Material React Table release
        run: |
          node scripts/pack-material-table-release.cjs --ref "$GITHUB_SHA" --tag material-react-table-3.2.1-ci --out "$RUNNER_TEMP/material-table-release"
          node scripts/check-material-table-release.cjs "$RUNNER_TEMP/material-table-release"
      - name: Verify independent React table adapter
        run: node scripts/react-table-conformance/archives.cjs
      - name: Verify independent headless table
        run: node scripts/table-conformance/archives.cjs
      - name: Verify independent table reactive store
        run: node scripts/store-conformance/archives.cjs
      - name: Verify independent React table virtualization
        run: node scripts/react-virtual-conformance/archives.cjs
      - name: Verify independent table ranking
        run: |
          npm --prefix scripts/match-sorter-conformance ci --ignore-scripts --no-audit --no-fund
          bun scripts/match-sorter-conformance/build.cjs
          node scripts/match-sorter-conformance/archives.cjs
      - name: Verify independent MUI transitions
        run: |
          npm --prefix scripts/transition-group-conformance ci --ignore-scripts --no-audit --no-fund
          node scripts/pack-transition-release.cjs --ref "$GITHUB_SHA" --tag react-transition-group-4.4.5-ci --out "$RUNNER_TEMP/transition-release"
          node scripts/check-transition-release.cjs "$RUNNER_TEMP/transition-release"
      - name: Verify DOM-helper elimination in MUI callers
        run: |
          npm --prefix scripts/transition-dom-audit ci --ignore-scripts --no-audit --no-fund
          node scripts/transition-dom-audit/contracts.cjs
          bun scripts/transition-dom-audit/contracts.cjs
          bun scripts/transition-dom-audit/build.cjs
          node scripts/transition-dom-audit/browser.cjs
      - run: npm --prefix scripts/rtl-conformance ci --ignore-scripts --no-audit --no-fund
      - run: bun scripts/rtl-conformance/build.cjs
      - run: node scripts/rtl-conformance/archives.cjs
      - name: Verify Stylis RTL release archives
        run: |
